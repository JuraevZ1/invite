<title>Приглашение на свидание</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap">
<style>
    /* Layout: one centered glass card over a night gradient with drifting hearts. Single dark look by choice. */
    :root {
        --bg-1: #0f0c29;
        --bg-2: #302b63;
        --bg-3: #24243e;
        --fg: #ffffff;
        --text: #f1f1f1;
        --title: #ffc2d1;
        --heart: rgba(255, 105, 180, 0.6);
        --yes-1: #ff416c;
        --yes-2: #ff4b2b;
        --no-bg: rgba(255, 255, 255, 0.2);
        --glass: rgba(255, 255, 255, 0.08);
        --glass-line: rgba(255, 255, 255, 0.2);
        --font-body: 'Montserrat', system-ui, sans-serif;
        --font-display: 'Playfair Display', Georgia, serif;
        color-scheme: dark;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        height: 100%;
    }

    body {
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
        font-family: var(--font-body);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: var(--fg);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 16px;
    }

    .hearts-container {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
    }

    .heart {
        position: absolute;
        background: var(--heart);
        transform: rotate(45deg);
        animation: floatUp 6s linear infinite;
    }

    .heart::before, .heart::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background: inherit;
        border-radius: 50%;
    }

    .heart::before { top: -50%; left: 0; }
    .heart::after { top: 0; left: -50%; }

    @keyframes floatUp {
        0% {
            transform: translateY(100vh) rotate(45deg) scale(0.5);
            opacity: 0;
        }
        50% { opacity: 0.8; }
        100% {
            transform: translateY(-10vh) rotate(45deg) scale(1.2);
            opacity: 0;
        }
    }

    .card {
        position: relative;
        z-index: 2;
        background: var(--glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-line);
        padding: 40px 30px;
        border-radius: 24px;
        text-align: center;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-family: var(--font-display);
        font-size: 28px;
        margin-bottom: 15px;
        color: var(--title);
        text-wrap: balance;
    }

    p {
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 25px;
        color: var(--text);
        font-weight: 300;
    }

    .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
        position: relative;
    }

    button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: var(--font-body);
    }

    button:focus-visible {
        outline: 2px solid var(--title);
        outline-offset: 3px;
    }

    #yesBtn {
        background: linear-gradient(135deg, var(--yes-1), var(--yes-2));
        color: #fff;
        box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
    }

    #yesBtn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
    }

    #noBtn {
        background: var(--no-bg);
        color: #fff;
        position: relative;
    }

    .success-icon {
        font-size: 50px;
        margin-bottom: 15px;
        animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
        from { transform: translateY(0); }
        to { transform: translateY(-10px); }
    }

    @media (prefers-reduced-motion: reduce) {
        .heart, .success-icon, .card { animation: none; }
    }
</style>

<div class="hearts-container" id="hearts"></div>

<div class="card">
    <div id="questionStep">
        <h1>Для особенного человека ✨</h1>
        <p>У меня есть прекрасный план на этот вечер, и в нем не хватает только тебя. Составишь мне компанию на свидании? 🍷</p>
        <div class="buttons">
            <button id="yesBtn" type="button" onclick="acceptInvite()">Да, с радостью! 💕</button>
            <button id="noBtn" type="button" onmouseover="moveNo()" onclick="moveNo()">Нет</button>
        </div>
    </div>

    <div id="successStep" hidden>
        <div class="success-icon">💖</div>
        <h1>Ура! Я знал, что ты согласишься!</h1>
        <p>Этот вечер будет незабываемым. Жду нашей встречи! ✨🥂</p>
    </div>
</div>

<script>
    // Падающие сердечки
    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        const size = Math.random() * 20 + 10 + 'px';
        heart.style.width = size;
        heart.style.height = size;
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        document.getElementById('hearts').appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }
    setInterval(createHeart, 400);

    // Убегающая кнопка «Нет»
    function moveNo() {
        const noBtn = document.getElementById('noBtn');
        const x = (Math.random() - 0.5) * 150;
        const y = (Math.random() - 0.5) * 100;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Действие при нажатии «Да»
    function acceptInvite() {
        document.getElementById('questionStep').hidden = true;
        document.getElementById('successStep').hidden = false;
    }
</script>
